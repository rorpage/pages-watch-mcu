<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Pages Watch MCU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body>
  <div class="mx-auto max-w-5xl px-4 py-10 text-center sm:py-16">

    <header class="mb-12 sm:mb-16">
      <div id="title"></div>
    </header>

    <section id="up-next" class="mb-16 sm:mb-20">
      <h2 class="section-heading">Up Next</h2>
      <div class="mx-auto max-w-md sm:max-w-3xl">
        <div class="hero-card">
          <div id="card-image" class="hero-card-poster"></div>
          <div class="hero-card-body">
            <h3 class="hero-card-label">Followed by</h3>
            <div id="upcoming-movies"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="previously-watched">
      <h2 class="section-heading">Previously Watched</h2>
      <p id="start-date" class="mb-6 text-sm text-white/70 sm:mb-8"></p>
      <div id="watched-movies"></div>
    </section>

  </div>

  <template id="up-next-movie">
    <img class="full-poster" src="" alt="{{title}}" />
    <p class="hero-card-caption"></p>
  </template>

  <script src="js/assemble.js"></script>

  <!-- Marvel 2021: June 5th - August 18th -->
  <!-- Marvel 2022 (with Oliver): June 10th -->
  <!-- Marvel 2023 (with Oliver and Ryleigh): June 3rd - October 14th -->
  <!-- Marvel 2024 (with Oliver and Ryleigh): June 1st -->
  <!-- Marvel 2025 (with Oliver, Ryleigh, Adalyn, and Brea): May 23, 2025 through January 9, 2026 -->
  <!-- Marvel 2026 (with Oliver, Ryleigh, Adalyn, and Brea): May 23, 2026 -->
</body>
</html>
